<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form id = "formulario_suscripcion">
    <fieldset>
<p>
    <label for="nombre">Nombre:</label>
    Nombre: <input type="text" name="nombre" placeholder="Ingrese su nombre"> 
</p>
<p>
    <label for="apellido">Apellido:</label>
    Apellido: <input type="text" name="apellido" placeholder="Ingrese su apellido">
</p>
<p>
    Sexo: 
    Masculino <input type="radio" name="sexo" value="masculino"> 
    <label for="masculino">Masculino</label>
    Femenino <input type="radio" name="sexo" value="femenino">
    <label for="femenino">Femenino</label>
</p>
<p>
    <label for="edad">Edad:</label>
    Edad: <input type="number" name="edad" placeholder="Ingrese su edad">
</p>
<p>
    <label for="mail">Mail</label>
    Email: <input type="email" name="email" placeholder="email@dominio.com">
</p>
</fieldset>
<fieldset>
    <legend>Datos de la cuenta</legend>
<p>
    <label for="usuario">Usuario</label>
    Usuario: <input type="text" name="usuario" placeholder="Ingrese su usuario">
</p>
<p>
    <label for="password">Password:</label>
    Password: <input type="password" id="password" name="password" placeholder="Ingrese su contraseña">
</p>
<p>
    <label for="confirm_password">Confirmar Password:</label>
    Confirmar Password: <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme su contraseña">
</p>
</fieldset>
<fieldset>
    <legend>Datos de suscripción</legend>
<p>
    <label for="tipo_servicio">Tipo de servicio:</label>
    <select name="tipo_servicio" id="tipo_servicio">
        <option value="free">Free</option>
        <option value="standard">Standard</option>
        <option value="premium">Premium</option>
    </select>
</p>
<p>
    Tipo de servicio:
    Free <input type = "checkbox" name="tipo_servicio" value="free"> 
    Standard <input type = "checkbox" name="tipo_servicio" value="standard"> 
    Premium <input type = "checkbox" name="tipo_servicio" value="premium">
</p>
<p>
    Tema:
    <label for="Politica">Politica:</label>
    <option>Política</option>
    <label for="Negocios">Negocios:</label>
    <option>Negocios</option>
    <label for="Tecnologia">Tecnología:</label>
    <option>Tecnología</option>
    <label for="Salud">Salud:</label>
    <option>Salud</option>
</p>
</fieldset>
<p>
<label for="comentario">Comentario:</label>
Agregue un comentario: <textarea name="comentario" rows="4" cols="50" placeholder="Ingrese su comentario"></textarea>
</p>
<p>
<button type="button"> Boton de Enviar</button>

</p>
</form>
</body>
</html>
